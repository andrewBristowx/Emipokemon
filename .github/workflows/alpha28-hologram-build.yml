name: alpha28-build

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Download exact alpha.27 source archive
        shell: bash
        run: |
          set -euxo pipefail
          curl -fL --retry 3 --retry-delay 2 \
            'https://drive.usercontent.google.com/download?id=1hW1-TH2UK6c2BIwZae7ux6zSM3opL10N&export=download&confirm=t' \
            -o alpha27-source.zip
          echo 'a7e5545668760f84d036ee017622d32d9b8fa0ffe4b77cfdae10d40c820abf4b  alpha27-source.zip' | sha256sum -c -
          rm -rf work
          mkdir work
          unzip -q alpha27-source.zip -d work

      - name: Apply alpha.28 patch
        shell: bash
        working-directory: work
        run: |
          set -euxo pipefail
          git apply "$GITHUB_WORKSPACE/ci/alpha28.patch"

      - name: Verify alpha.28 source identity
        shell: bash
        run: |
          set -euxo pipefail
          grep -q '^mod_version=0.4.0-alpha.28' work/gradle.properties
          grep -q 'CUSTOM_NAME_PREFIX = "Emipokemon hologram "' work/src/client/java/com/emipokemon/client/emote/HologramTextResolver.java
          grep -q 'display.getCustomName()' work/src/client/java/com/emipokemon/client/emote/HologramTextResolver.java
          grep -q 'data.flags() & ~0x02' work/src/client/java/com/emipokemon/client/mixin/TextDisplayHologramMixin.java
          grep -q 'VanillaTextHologram.configure(loaded, world, entry)' work/src/main/java/com/emipokemon/hologram/HologramService.java
          grep -q '0.4.0-alpha.28' work/CHANGELOG-0.4.0-alpha.28.md

      - name: Normalize Gradle wrapper
        shell: bash
        working-directory: work
        run: |
          sed -i 's/\r$//' gradlew
          chmod +x gradlew

      - name: Test and build with Java 21
        shell: bash
        working-directory: work
        run: ./gradlew clean test build --no-daemon --stacktrace

      - name: Verify built version and generate checksums
        shell: bash
        run: |
          set -euxo pipefail
          test -f work/build/libs/emipokemon-0.4.0-alpha.28.jar
          unzip -p work/build/libs/emipokemon-0.4.0-alpha.28.jar fabric.mod.json | grep -q '0.4.0-alpha.28'
          sha256sum work/build/libs/*.jar | tee SHA256SUMS-0.4.0-alpha.28-github.txt

      - name: Upload alpha.28 build
        uses: actions/upload-artifact@v4
        with:
          name: Emipokemon-0.4.0-alpha.28-github-build
          path: |
            work/build/libs/*.jar
            SHA256SUMS-0.4.0-alpha.28-github.txt
          if-no-files-found: error
