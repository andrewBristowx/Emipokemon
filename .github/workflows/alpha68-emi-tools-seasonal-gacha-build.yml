name: alpha68-emi-tools-seasonal-gacha-build

on:
  push:
    branches: [release/0.4.0-alpha.68]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - name: Download exact alpha.62 source candidate
        shell: bash
        run: |
          set -euxo pipefail
          curl -fL --retry 3 --retry-delay 2 \
            'https://drive.usercontent.google.com/download?id=1U3KGE4F-Xs1NmxJOpyXALoCD-ZICMhTm&export=download&confirm=t' \
            -o alpha62-source.zip
          echo '56cdf22219db733383da8fc20db48930105167b01571d2ac381a7c1a05e5ba6b  alpha62-source.zip' | sha256sum -c -
          mkdir work
          unzip_rc=0
          unzip -q alpha62-source.zip -d work || unzip_rc=$?
          test "$unzip_rc" -le 1
          chmod -R u+rwX work
      - name: Reconstruct exact alpha.68 candidate
        working-directory: work
        run: |
          python3 "$GITHUB_WORKSPACE/ci/alpha63_core.py"
          python3 "$GITHUB_WORKSPACE/ci/alpha63_tests.py"
          python3 "$GITHUB_WORKSPACE/ci/alpha64_core.py"
          python3 "$GITHUB_WORKSPACE/ci/alpha64_tests.py"
          python3 "$GITHUB_WORKSPACE/ci/alpha65_core.py"
          python3 "$GITHUB_WORKSPACE/ci/alpha65_tests.py"
          python3 "$GITHUB_WORKSPACE/ci/alpha66_core.py"
          python3 "$GITHUB_WORKSPACE/ci/alpha66_tests.py"
          python3 "$GITHUB_WORKSPACE/ci/alpha67_core.py"
          python3 "$GITHUB_WORKSPACE/ci/alpha67_tests.py"
          python3 "$GITHUB_WORKSPACE/ci/alpha68_core.py"
          python3 "$GITHUB_WORKSPACE/ci/alpha68_tests.py"
          cp "$GITHUB_WORKSPACE/CHANGELOG-0.4.0-alpha.68.md" .
          cp "$GITHUB_WORKSPACE/GUIA-PRUEBAS-0.4.0-alpha.68.md" .
      - name: Test and build common, server and client with Java 21
        working-directory: work
        run: |
          sed -i 's/\r$//' gradlew
          chmod +x gradlew
          for attempt in 1 2 3; do
            if ./gradlew --version --no-daemon; then break; fi
            if [ "$attempt" -eq 3 ]; then exit 1; fi
            sleep $((attempt * 5))
          done
          ./gradlew clean test build --no-daemon --stacktrace
      - name: Verify and package candidate
        shell: bash
        run: |
          set -euxo pipefail
          jar='work/build/libs/emipokemon-0.4.0-alpha.68.jar'
          test -f "$jar"
          unzip -p "$jar" fabric.mod.json | grep -q '0.4.0-alpha.68'
          for entry in \
            'com/emipokemon/tools/EmiToolMaterial.class' \
            'com/emipokemon/tools/EmiToolActions.class' \
            'com/emipokemon/tools/EmiPickaxeItem.class' \
            'com/emipokemon/tools/EmiAxeItem.class' \
            'com/emipokemon/tools/EmiShovelItem.class' \
            'com/emipokemon/tools/EmiHoeItem.class' \
            'com/emipokemon/client/render/SeasonalPokemonWorldRenderer.class' \
            'com/emipokemon/client/gacha/GachaScreen.class' \
            'assets/emipokemon/textures/item/emi_sword.png' \
            'assets/emipokemon/textures/item/emi_pickaxe.png' \
            'assets/emipokemon/textures/item/emi_axe.png' \
            'assets/emipokemon/textures/item/emi_shovel.png' \
            'assets/emipokemon/textures/item/emi_hoe.png'; do
            unzip -l "$jar" | grep -q "$entry"
          done
          if unzip -l "$jar" | grep -q 'textures/gui/gacha/reveal_sheet.png'; then exit 1; fi
          test "$(unzip -p "$jar" assets/emipokemon/textures/gui/gacha/standard_gacha.png | sha256sum | cut -d' ' -f1)" = '694aadcaca9a8dcaace9c26a9e43cf41e056203855cd380670d0b7c208f4d98d'
          test "$(unzip -p "$jar" assets/emipokemon/textures/gui/gacha/emi_gacha.png | sha256sum | cut -d' ' -f1)" = '4c61d6a00e324a82d060b8c7b9a3abe40daa437fda8d8efb5a4eaf45b973e216'
          cd work
          zip -qr ../Emipokemon-0.4.0-alpha.68-source.zip . -x 'build/*' '.gradle/*'
          cd ..
          sha256sum "$jar" Emipokemon-0.4.0-alpha.68-source.zip > SHA256SUMS-0.4.0-alpha.68.txt
      - uses: actions/upload-artifact@v4
        with:
          name: Emipokemon-0.4.0-alpha.68-github-build
          path: |
            work/build/libs/emipokemon-0.4.0-alpha.68.jar
            Emipokemon-0.4.0-alpha.68-source.zip
            SHA256SUMS-0.4.0-alpha.68.txt
          if-no-files-found: error
