name: alpha98-build

on:
  push:
    branches: [release/0.4.0-alpha.98]
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Restore exact validated alpha.90 source
        shell: bash
        run: |
          set -euxo pipefail
          curl -fL --retry 3 --retry-delay 2 \
            'https://drive.usercontent.google.com/download?id=1xTf9VME01DtwG2v7-I08_9YkLHpbHUcS&export=download&confirm=t' \
            -o alpha90-source.zip
          echo '676225108e37cc14ce692c1b180302c7ea590b3adfe9b84fa8f54d7e49a0c78d  alpha90-source.zip' | sha256sum -c -
          mkdir work
          unzip -q alpha90-source.zip -d work
          grep -q 'mod_version=0.4.0-alpha.90' work/gradle.properties
          grep -q 'VERSION = "0.4.0-alpha.90"' work/src/main/java/com/emipokemon/Emipokemon.java

      - name: Apply alpha.98 vanilla handheld tool patch
        working-directory: work
        shell: bash
        run: |
          set -euxo pipefail
          python3 ../ci/alpha98/patch_alpha98.py
          # Correct the shovel payload byte-for-byte to the validated local alpha.98 sprite.
          python3 - <<'PY'
          from pathlib import Path
          import base64, hashlib
          data=base64.b64decode('iVBORw0KGgoAAAANSUhEUgAAABAAAAAQCAYAAAAf8/9hAAAAk0lEQVR4nGNgGGjASIriI3YT/8PYNofySdLLcMRu4v//X/7DsYqY1n/CutA0Pzj17v+DU+/+f3rwE24AEzGa9RZlMDy89p7h3t77JLkaDqzUXP7vaz+LYTvRmr/s8PivIqZFmWYGBgYGkjW/CJpLmo3ImstiWuis2UrN5b+Vmsv/iQVLybcZOcDIAipiWpQZQA4AACzccC3nCXbqAAAAAElFTkSuQmCC')
          assert hashlib.sha256(data).hexdigest() == 'f528d40ff3f1cd947b5a6e2b8bbea9e5a0b2f4bbbec17b4eaaabf0a5d484399a'
          Path('src/main/resources/assets/emipokemon/textures/item/emi_shovel.png').write_bytes(data)
          PY
          grep -q 'mod_version=0.4.0-alpha.98' gradle.properties
          grep -q 'VERSION = "0.4.0-alpha.98"' src/main/java/com/emipokemon/Emipokemon.java

      - name: Validate visual invariants before compile
        working-directory: work
        shell: bash
        run: |
          set -euxo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import hashlib, struct

          expected_pngs = {
              'sword': '1540614909181e432680a0860ed39702553929919b45b7681155b07d981e078b',
              'pickaxe': '6954d581169275d213046e41772a57f934ab0ffd84f311e2ea6fc344e0d0c1d7',
              'axe': 'fe9d4f5d41e86122fcf040f5381bf173e0b0f5334a7314f95ce5a89e2a96774a',
              'shovel': 'f528d40ff3f1cd947b5a6e2b8bbea9e5a0b2f4bbbec17b4eaaabf0a5d484399a',
              'hoe': '946b14b5ce1f31295c8be2cc401aff91bc63173051f10e8d6de6e6fde3690ca2',
          }

          for tool, expected in expected_pngs.items():
              p=Path(f'src/main/resources/assets/emipokemon/textures/item/emi_{tool}.png')
              data=p.read_bytes()
              assert data[:8] == b'\x89PNG\r\n\x1a\n', tool
              assert struct.unpack('>II', data[16:24]) == (16,16), tool
              assert hashlib.sha256(data).hexdigest() == expected, tool
              model=Path(f'src/main/resources/assets/emipokemon/models/item/emi_{tool}.json').read_text()
              assert '"parent": "minecraft:item/handheld"' in model, tool
              assert '"display"' not in model, tool
              assert '"scale"' not in model, tool
              assert '"translation"' not in model, tool
              assert '"rotation"' not in model, tool

          client=Path('src/client/java/com/emipokemon/client/EmipokemonClient.java').read_text()
          assert 'registerEmiToolRenderer' not in client
          assert 'registerEmiArmorRenderer(ModRegistries.EMI_HELMET)' in client
          assert 'registerEmiArmorRenderer(ModRegistries.EMI_CHESTPLATE)' in client
          assert 'registerEmiArmorRenderer(ModRegistries.EMI_LEGGINGS)' in client
          assert 'registerEmiArmorRenderer(ModRegistries.EMI_BOOTS)' in client
          for cls in ('EmiSwordItem.java','EmiPickaxeItem.java','EmiAxeItem.java','EmiShovelItem.java','EmiHoeItem.java'):
              code=Path('src/main/java/com/emipokemon/tools',cls).read_text()
              assert 'implements EmiGeoToolItem' not in code, cls
          PY

      - name: Package exact alpha.98 source
        shell: bash
        run: |
          set -euxo pipefail
          (cd work && zip -qr ../Emipokemon-0.4.0-alpha.98-source.zip . -x '.gradle/*' 'build/*')

      - name: Compile with Java 21
        working-directory: work
        shell: bash
        run: |
          set -euxo pipefail
          sed -i 's/\r$//' gradlew
          chmod +x gradlew
          ./gradlew clean build -x test --no-daemon --stacktrace

      - name: Run alpha.98 tool and alpha.90 armor regression tests
        working-directory: work
        shell: bash
        run: |
          set -euxo pipefail
          ./gradlew test \
            --tests com.emipokemon.alpha98.Alpha98VanillaHandheldToolsRegressionTest \
            --tests com.emipokemon.alpha90.Alpha90HeartUvRegressionTest \
            --no-daemon --stacktrace

      - name: Verify and package alpha.98
        shell: bash
        run: |
          set -euxo pipefail
          jar='work/build/libs/emipokemon-0.4.0-alpha.98.jar'
          test -f "$jar"
          unzip -p "$jar" fabric.mod.json | grep -q '0.4.0-alpha.98'
          unzip -p "$jar" assets/emipokemon/models/item/emi_sword.json | grep -q 'minecraft:item/handheld'
          ! unzip -p "$jar" assets/emipokemon/models/item/emi_sword.json | grep -q 'builtin/entity'
          unzip -l "$jar" | grep -q 'assets/emipokemon/geo/armor/emi_armor.geo.json'
          unzip -l "$jar" | grep -q 'assets/emipokemon/textures/models/armor/emi_gecko_armor.png'
          for tool in sword pickaxe axe shovel hoe; do
            unzip -p "$jar" "assets/emipokemon/models/item/emi_${tool}.json" | grep -q 'minecraft:item/handheld'
            unzip -p "$jar" "assets/emipokemon/textures/item/emi_${tool}.png" > "/tmp/emi_${tool}.png"
          done
          sha256sum "$jar" Emipokemon-0.4.0-alpha.98-source.zip > SHA256SUMS-0.4.0-alpha.98.txt

      - uses: actions/upload-artifact@v4
        with:
          name: Emipokemon-0.4.0-alpha.98-github-build
          path: |
            work/build/libs/emipokemon-0.4.0-alpha.98.jar
            Emipokemon-0.4.0-alpha.98-source.zip
            SHA256SUMS-0.4.0-alpha.98.txt
            work/CHANGELOG-0.4.0-alpha.98.md
            work/GUIA-PRUEBAS-0.4.0-alpha.98.md
          if-no-files-found: error
