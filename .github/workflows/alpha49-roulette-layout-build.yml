name: alpha49-roulette-layout-build

on:
  push:
    branches: [release/0.4.0-alpha.49]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout alpha.49 transforms
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Download exact alpha.48 source baseline
        shell: bash
        run: |
          set -euxo pipefail
          curl -fL --retry 3 --retry-delay 2 \
            'https://drive.usercontent.google.com/download?id=1pfp3rREGl5IBAAnV5tKLCMdupi34Mce2&export=download&confirm=t' \
            -o alpha48-source.zip
          echo 'bd5ce85b5534c632ee8761c9c7a494fb2806046bd29d5d70ffe876cc10dc6119  alpha48-source.zip' | sha256sum -c -
          rm -rf work
          mkdir work
          unzip -q alpha48-source.zip -d work

      - name: Apply only alpha.49 changes
        shell: bash
        working-directory: work
        run: |
          set -euxo pipefail
          git apply -p0 "$GITHUB_WORKSPACE/ci/alpha49_visual_and_server.patch"
          python3 "$GITHUB_WORKSPACE/ci/alpha49_core.py"
          python3 "$GITHUB_WORKSPACE/ci/alpha49_tests.py"

      - name: Verify alpha.49 invariants
        shell: bash
        run: |
          set -euxo pipefail
          grep -q '^mod_version=0.4.0-alpha.49' work/gradle.properties
          grep -q 'gameX = panelX' work/src/client/java/com/emipokemon/client/casino/CasinoScreen.java
          grep -q 'sideW = panelX + panelW - sideX' work/src/client/java/com/emipokemon/client/casino/CasinoScreen.java
          grep -q 'amountField.visible = false' work/src/client/java/com/emipokemon/client/casino/CasinoScreen.java
          ! grep -q 'renderRouletteEdgeCleanup' work/src/client/java/com/emipokemon/client/casino/CasinoScreen.java
          grep -q 'MAX_ROULETTE_PLAYERS = 8' work/src/main/java/com/emipokemon/casino/CasinoTableService.java
          grep -q 'state.players()' work/src/client/java/com/emipokemon/client/casino/CasinoScreen.java
          grep -q 'send(cell.action)' work/src/client/java/com/emipokemon/client/casino/CasinoScreen.java

      - name: Test and build with Java 21
        shell: bash
        working-directory: work
        run: |
          sed -i 's/\r$//' gradlew
          chmod +x gradlew
          ./gradlew clean test build --no-daemon --stacktrace

      - name: Verify release and checksums
        shell: bash
        run: |
          set -euxo pipefail
          test -f work/build/libs/emipokemon-0.4.0-alpha.49.jar
          unzip -p work/build/libs/emipokemon-0.4.0-alpha.49.jar fabric.mod.json | grep -q '0.4.0-alpha.49'
          sha256sum work/build/libs/emipokemon-0.4.0-alpha.49.jar | tee SHA256SUMS-0.4.0-alpha.49.txt
          cd work
          zip -qr ../Emipokemon-0.4.0-alpha.49-source.zip . -x 'build/*' '.gradle/*'
          cd ..
          sha256sum Emipokemon-0.4.0-alpha.49-source.zip >> SHA256SUMS-0.4.0-alpha.49.txt

      - name: Upload alpha.49 build
        uses: actions/upload-artifact@v4
        with:
          name: Emipokemon-0.4.0-alpha.49-github-build
          path: |
            work/build/libs/emipokemon-0.4.0-alpha.49.jar
            Emipokemon-0.4.0-alpha.49-source.zip
            SHA256SUMS-0.4.0-alpha.49.txt
          if-no-files-found: error
