name: 050a3-build

on:
  push:
    branches: [release/0.5.0-alpha.3]
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Restore exact 0.5.0-alpha.3 source
        shell: bash
        run: |
          set -euxo pipefail
          curl -fL --retry 3 --retry-delay 2 \
            'https://drive.usercontent.google.com/download?id=1Y66e3yAD48DMGlra0L6_ldrW3mu5cQE8&export=download&confirm=t' \
            -o Emipokemon-0.5.0-alpha.3-source.zip
          echo '631485e645535759bf483cd599e50a35da544e111532db943198c5cc96eb0462  Emipokemon-0.5.0-alpha.3-source.zip' | sha256sum -c -
          mkdir work
          unzip -q Emipokemon-0.5.0-alpha.3-source.zip -d work
          grep -q 'mod_version=0.5.0-alpha.3' work/gradle.properties
          grep -q 'VERSION = "0.5.0-alpha.3"' work/src/main/java/com/emipokemon/Emipokemon.java

      - name: Validate alpha.3 source and protected assets
        working-directory: work
        shell: bash
        run: |
          set -euxo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import hashlib, re, struct

          catalog = Path('src/main/java/com/emipokemon/challenge/ChallengeCatalog.java').read_text()
          profiles = re.findall(r'\bp\("(kanto|johto|hoenn|sinnoh)"\s*,', catalog)
          assert len(profiles) == 52, len(profiles)
          assert {r: profiles.count(r) for r in set(profiles)} == {'kanto':13,'johto':13,'hoenn':13,'sinnoh':13}
          for token in ['elite_lorelei','champion_blue','champion_lance','champion_steven','champion_cynthia']:
              assert token in catalog

          bridge = Path('src/main/java/com/emipokemon/challenge/RctCobbleverseBridge.java').read_text()
          assert 'com.gitlab.srcmc.rctmod.api.data.sync.PlayerState' in bridge
          assert 'getTrainerRegistry' in bridge and 'getById' in bridge
          assert 'hoenn:roxanne' in bridge and 'sinnoh:cynthia' in bridge

          resolver = Path('src/client/java/com/emipokemon/client/render/RctTrainerTextureResolver.java').read_text()
          assert 'textures/trainers' in resolver and 'rctmod' in resolver
          renderer = Path('src/client/java/com/emipokemon/client/render/CustomNpcRenderer.java').read_text()
          assert 'ClientVisualAssetCache.has(key)' in renderer

          journal = Path('src/client/java/com/emipokemon/client/progress/QuestJournalScreen.java').read_text()
          for token in ['enableScissor','mouseScrolled','mouseDragged','drawChapterScrollbar','chapterScroll']:
              assert token in journal

          quests = Path('src/main/java/com/emipokemon/progress/QuestCatalog.java').read_text()
          for token in ['structure_match:rocket,tower','Torre Campana','Pilar Celeste','Columna Lanza']:
              assert token in quests

          skin = Path('src/main/resources/assets/emipokemon/textures/entity/professor_emi.png').read_bytes()
          assert skin[:8] == b'\x89PNG\r\n\x1a\n'
          assert struct.unpack('>II', skin[16:24]) == (64,64)
          assert hashlib.sha256(skin).hexdigest() == '84b2b0bc9c6bcccc0674ec91587a845310c167e1839addd2a0c511107e848095'

          expected_pngs={
            'sword':'1540614909181e432680a0860ed39702553929919b45b7681155b07d981e078b',
            'pickaxe':'6954d581169275d213046e41772a57f934ab0ffd84f311e2ea6fc344e0d0c1d7',
            'axe':'fe9d4f5d41e86122fcf040f5381bf173e0b0f5334a7314f95ce5a89e2a96774a',
            'shovel':'f528d40ff3f1cd947b5a6e2b8bbea9e5a0b2f4bbbec17b4eaaabf0a5d484399a',
            'hoe':'946b14b5ce1f31295c8be2cc401aff91bc63173051f10e8d6de6e6fde3690ca2'}
          for tool, expected in expected_pngs.items():
              data=Path(f'src/main/resources/assets/emipokemon/textures/item/emi_{tool}.png').read_bytes()
              assert struct.unpack('>II', data[16:24]) == (16,16)
              assert hashlib.sha256(data).hexdigest() == expected
              model=Path(f'src/main/resources/assets/emipokemon/models/item/emi_{tool}.json').read_text()
              assert 'minecraft:item/handheld' in model and '"display"' not in model
          PY

      - name: Compile with Java 21
        working-directory: work
        shell: bash
        run: |
          set -euxo pipefail
          sed -i 's/\r$//' gradlew
          chmod +x gradlew
          ./gradlew clean build -x test --no-daemon --stacktrace

      - name: Run alpha.3 and inherited regression tests
        working-directory: work
        shell: bash
        run: |
          set -euxo pipefail
          ./gradlew test \
            --tests com.emipokemon.v050a3.Version050Alpha3RegressionTest \
            --tests com.emipokemon.challenge.ChallengeCatalogTest \
            --tests com.emipokemon.progress.QuestCatalogTest \
            --tests com.emipokemon.data.PlayerDataMigrationTest \
            --tests com.emipokemon.alpha98.Alpha98VanillaHandheldToolsRegressionTest \
            --tests com.emipokemon.alpha90.Alpha90HeartUvRegressionTest \
            --no-daemon --stacktrace

      - name: Verify final jar
        shell: bash
        run: |
          set -euxo pipefail
          jar='work/build/libs/emipokemon-0.5.0-alpha.3.jar'
          test -f "$jar"
          unzip -p "$jar" fabric.mod.json | grep -q '0.5.0-alpha.3'
          unzip -l "$jar" | grep -q 'assets/emipokemon/textures/entity/professor_emi.png'
          unzip -l "$jar" | grep -q 'com/emipokemon/challenge/RctCobbleverseBridge.class'
          unzip -l "$jar" | grep -q 'com/emipokemon/client/render/RctTrainerTextureResolver.class'
          unzip -p "$jar" assets/emipokemon/models/item/emi_sword.json | grep -q 'minecraft:item/handheld'
          sha256sum "$jar" Emipokemon-0.5.0-alpha.3-source.zip > SHA256SUMS-0.5.0-alpha.3.txt

      - uses: actions/upload-artifact@v4
        with:
          name: Emipokemon-0.5.0-alpha.3-github-build
          path: |
            work/build/libs/emipokemon-0.5.0-alpha.3.jar
            Emipokemon-0.5.0-alpha.3-source.zip
            SHA256SUMS-0.5.0-alpha.3.txt
            work/CHANGELOG-0.5.0-alpha.3.md
            work/GUIA-PRUEBAS-0.5.0-alpha.3.md
          if-no-files-found: error
