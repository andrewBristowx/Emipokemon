name: 050a2-build

on:
  push:
    branches: [release/0.5.0-alpha.2]
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Restore exact validated alpha.90 source
        shell: bash
        run: |
          set -euxo pipefail
          curl -fL --retry 3 --retry-delay 2 \
            'https://drive.usercontent.google.com/download?id=1xTf9VME01DtwG2v7-I08_9YkLHpbHUcS&export=download&confirm=t' \
            -o alpha90-source.zip
          echo '676225108e37cc14ce692c1b180302c7ea590b3adfe9b84fa8f54d7e49a0c78d  alpha90-source.zip' | sha256sum -c -
          mkdir work
          unzip -q alpha90-source.zip -d work
          grep -q 'mod_version=0.4.0-alpha.90' work/gradle.properties

      - name: Rebuild exact approved alpha.98 base
        working-directory: work
        shell: bash
        run: |
          set -euxo pipefail
          python3 ../ci/alpha98/patch_alpha98.py
          python3 ../ci/v050a2/fix_shovel.py
          grep -q 'mod_version=0.4.0-alpha.98' gradle.properties

      - name: Rebuild exact 0.5.0-alpha.1 base
        working-directory: work
        shell: bash
        run: |
          set -euxo pipefail
          python3 ../ci/v050a1/patch_v050a1.py
          grep -q 'mod_version=0.5.0-alpha.1' gradle.properties
          grep -q 'VERSION = "0.5.0-alpha.1"' src/main/java/com/emipokemon/Emipokemon.java

      - name: Apply 0.5.0-alpha.2 challenge patch
        working-directory: work
        shell: bash
        run: |
          set -euxo pipefail
          python3 ../ci/v050a2/apply.py
          grep -q 'mod_version=0.5.0-alpha.2' gradle.properties
          grep -q 'VERSION = "0.5.0-alpha.2"' src/main/java/com/emipokemon/Emipokemon.java

      - name: Validate challenge, dialogue, mission and legacy assets
        working-directory: work
        shell: bash
        run: |
          set -euxo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import hashlib, re, struct

          catalog = Path('src/main/java/com/emipokemon/challenge/ChallengeCatalog.java').read_text()
          profiles = re.findall(r'\bp\("(kanto|johto|hoenn|sinnoh)"\s*,', catalog)
          assert len(profiles) == 32, len(profiles)
          assert {r: profiles.count(r) for r in set(profiles)} == {'kanto':8,'johto':8,'hoenn':8,'sinnoh':8}
          assert 'PROFESSOR_NPC_ID = "profesora_emi"' in catalog

          quests = Path('src/main/java/com/emipokemon/progress/QuestCatalog.java').read_text()
          leaders = re.findall(r'\bleader\("(kanto|johto|hoenn|sinnoh)"\s*,\s*"([a-z0-9_]+)"', quests)
          assert len(leaders) == 32, len(leaders)
          assert len(set(leaders)) == 32
          objectives = [f'regional_trainer:{r}:{l}' for r,l in leaders]
          assert len(objectives) == len(set(objectives)) == 32
          for legacy in ['defeat_brock','defeat_misty','defeat_lt_surge','defeat_erika','defeat_koga','defeat_sabrina','defeat_blaine','defeat_giovanni']:
              assert legacy in quests
          assert 'defeat_johto_falkner' in quests
          assert 'defeat_hoenn_roxanne' in quests
          assert 'defeat_sinnoh_roark' in quests

          dialogue = Path('src/client/java/com/emipokemon/client/npc/NpcDialogueScreen.java').read_text()
          assert 'Siguiente' in dialogue and 'Saltar' in dialogue and 'Salir' in dialogue
          networking = Path('src/main/java/com/emipokemon/npc/NpcNetworking.java').read_text()
          assert 'DialogueActionPayload' in networking
          battle = Path('src/main/java/com/emipokemon/npc/NpcBattleService.java').read_text()
          assert 'ChallengeService.canChallenge' in battle
          assert 'ChallengeService.onVictory' in battle

          skin = Path('src/main/resources/assets/emipokemon/textures/entity/professor_emi.png').read_bytes()
          assert skin[:8] == b'\x89PNG\r\n\x1a\n'
          assert struct.unpack('>II', skin[16:24]) == (64,64)
          assert hashlib.sha256(skin).hexdigest() == '1b5358e5ae0d05424bd63219cdfeab38712cf74218d228bc5516d7763f3046cc'

          expected_pngs={
            'sword':'1540614909181e432680a0860ed39702553929919b45b7681155b07d981e078b',
            'pickaxe':'6954d581169275d213046e41772a57f934ab0ffd84f311e2ea6fc344e0d0c1d7',
            'axe':'fe9d4f5d41e86122fcf040f5381bf173e0b0f5334a7314f95ce5a89e2a96774a',
            'shovel':'f528d40ff3f1cd947b5a6e2b8bbea9e5a0b2f4bbbec17b4eaaabf0a5d484399a',
            'hoe':'946b14b5ce1f31295c8be2cc401aff91bc63173051f10e8d6de6e6fde3690ca2'}
          for tool, expected in expected_pngs.items():
              data=Path(f'src/main/resources/assets/emipokemon/textures/item/emi_{tool}.png').read_bytes()
              assert struct.unpack('>II', data[16:24]) == (16,16)
              assert hashlib.sha256(data).hexdigest() == expected
              model=Path(f'src/main/resources/assets/emipokemon/models/item/emi_{tool}.json').read_text()
              assert 'minecraft:item/handheld' in model and '"display"' not in model
          PY

      - name: Package exact source
        shell: bash
        run: |
          set -euxo pipefail
          (cd work && zip -qr ../Emipokemon-0.5.0-alpha.2-source.zip . -x '.gradle/*' 'build/*')

      - name: Compile with Java 21
        working-directory: work
        shell: bash
        run: |
          set -euxo pipefail
          sed -i 's/\r$//' gradlew
          chmod +x gradlew
          ./gradlew clean build -x test --no-daemon --stacktrace

      - name: Run alpha.2 and inherited regression tests
        working-directory: work
        shell: bash
        run: |
          set -euxo pipefail
          ./gradlew test \
            --tests com.emipokemon.v050a2.Version050Alpha2RegressionTest \
            --tests com.emipokemon.challenge.ChallengeCatalogTest \
            --tests com.emipokemon.progress.QuestCatalogTest \
            --tests com.emipokemon.data.PlayerDataMigrationTest \
            --tests com.emipokemon.v050a1.Version050Alpha1RegressionTest \
            --tests com.emipokemon.alpha98.Alpha98VanillaHandheldToolsRegressionTest \
            --tests com.emipokemon.alpha90.Alpha90HeartUvRegressionTest \
            --no-daemon --stacktrace

      - name: Verify final jar
        shell: bash
        run: |
          set -euxo pipefail
          jar='work/build/libs/emipokemon-0.5.0-alpha.2.jar'
          test -f "$jar"
          unzip -p "$jar" fabric.mod.json | grep -q '0.5.0-alpha.2'
          unzip -l "$jar" | grep -q 'assets/emipokemon/textures/entity/professor_emi.png'
          unzip -l "$jar" | grep -q 'com/emipokemon/challenge/ChallengeCatalog.class'
          unzip -p "$jar" assets/emipokemon/models/item/emi_sword.json | grep -q 'minecraft:item/handheld'
          sha256sum "$jar" Emipokemon-0.5.0-alpha.2-source.zip > SHA256SUMS-0.5.0-alpha.2.txt

      - uses: actions/upload-artifact@v4
        with:
          name: Emipokemon-0.5.0-alpha.2-github-build
          path: |
            work/build/libs/emipokemon-0.5.0-alpha.2.jar
            Emipokemon-0.5.0-alpha.2-source.zip
            SHA256SUMS-0.5.0-alpha.2.txt
            work/CHANGELOG-0.5.0-alpha.2.md
            work/GUIA-PRUEBAS-0.5.0-alpha.2.md
          if-no-files-found: error
