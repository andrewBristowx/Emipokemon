name: alpha63-interactive-claw-pokemon-display-build

on:
  push:
    branches: [release/0.4.0-alpha.63]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - name: Download exact alpha.62 source candidate
        shell: bash
        run: |
          set -euxo pipefail
          curl -fL --retry 3 --retry-delay 2 \
            'https://drive.usercontent.google.com/download?id=1U3KGE4F-Xs1NmxJOpyXALoCD-ZICMhTm&export=download&confirm=t' \
            -o alpha62-source.zip
          echo '56cdf22219db733383da8fc20db48930105167b01571d2ac381a7c1a05e5ba6b  alpha62-source.zip' | sha256sum -c -
          mkdir work
          unzip -q alpha62-source.zip -d work
      - name: Apply alpha.63 only over alpha.62
        working-directory: work
        run: |
          python3 "$GITHUB_WORKSPACE/ci/alpha63_core.py"
          python3 "$GITHUB_WORKSPACE/ci/alpha63_tests.py"
          cp "$GITHUB_WORKSPACE/CHANGELOG-0.4.0-alpha.63.md" .
          cp "$GITHUB_WORKSPACE/GUIA-PRUEBAS-0.4.0-alpha.63.md" .
      - name: Test and build common, server and client with Java 21
        working-directory: work
        run: |
          sed -i 's/\r$//' gradlew
          chmod +x gradlew
          ./gradlew clean test build --no-daemon --stacktrace
      - name: Verify candidate and package source
        shell: bash
        run: |
          set -euxo pipefail
          test -f work/build/libs/emipokemon-0.4.0-alpha.63.jar
          unzip -p work/build/libs/emipokemon-0.4.0-alpha.63.jar fabric.mod.json | grep -q '0.4.0-alpha.63'
          unzip -l work/build/libs/emipokemon-0.4.0-alpha.63.jar | grep -q 'CasinoScreen.class'
          unzip -l work/build/libs/emipokemon-0.4.0-alpha.63.jar | grep -q 'ClawGameService.class'
          cd work
          zip -qr ../Emipokemon-0.4.0-alpha.63-source.zip . -x 'build/*' '.gradle/*'
          cd ..
          sha256sum work/build/libs/emipokemon-0.4.0-alpha.63.jar Emipokemon-0.4.0-alpha.63-source.zip > SHA256SUMS-0.4.0-alpha.63.txt
      - uses: actions/upload-artifact@v4
        with:
          name: Emipokemon-0.4.0-alpha.63-github-build
          path: |
            work/build/libs/emipokemon-0.4.0-alpha.63.jar
            Emipokemon-0.4.0-alpha.63-source.zip
            SHA256SUMS-0.4.0-alpha.63.txt
          if-no-files-found: error
