name: alpha26-build

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Download exact alpha.26 source archive
        shell: bash
        run: |
          set -euxo pipefail
          curl -fL --retry 3 --retry-delay 2 \
            'https://drive.usercontent.google.com/download?id=13Uek6OGN9dX0nWOP-ZgbgNPWi8w0agnV&export=download&confirm=t' \
            -o alpha26-source.zip
          echo '977f1ff882b55da2da9d41172900524c88a7158652204ac2a2cfb6e6da293bfc  alpha26-source.zip' | sha256sum -c -
          rm -rf work
          mkdir work
          unzip -q alpha26-source.zip -d work

      - name: Verify alpha.26 source identity
        shell: bash
        run: |
          set -euxo pipefail
          grep -Fx 'mod_version=0.4.0-alpha.26' work/gradle.properties
          grep -q 'EntityType.TEXT_DISPLAY' work/src/main/java/com/emipokemon/hologram/HologramService.java
          grep -q 'DisplayEntity.TextDisplayEntity' work/src/main/java/com/emipokemon/hologram/VanillaTextHologram.java
          grep -q '0.4.0-alpha.26' work/CHANGELOG-0.4.0-alpha.26.md

      - name: Normalize Gradle wrapper
        shell: bash
        working-directory: work
        run: |
          sed -i 's/\r$//' gradlew
          chmod +x gradlew

      - name: Test and build with Java 21
        shell: bash
        working-directory: work
        run: ./gradlew clean test build --no-daemon --stacktrace

      - name: Verify built version and generate checksums
        shell: bash
        run: |
          set -euxo pipefail
          test -f work/build/libs/emipokemon-0.4.0-alpha.26.jar
          unzip -p work/build/libs/emipokemon-0.4.0-alpha.26.jar fabric.mod.json | grep -q '0.4.0-alpha.26'
          sha256sum work/build/libs/*.jar | tee SHA256SUMS-0.4.0-alpha.26-github.txt

      - name: Upload alpha.26 build
        uses: actions/upload-artifact@v4
        with:
          name: Emipokemon-0.4.0-alpha.26-github-build
          path: |
            work/build/libs/*.jar
            SHA256SUMS-0.4.0-alpha.26-github.txt
          if-no-files-found: error
