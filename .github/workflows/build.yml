name: Build Emipokemon

on:
  push:
    branches:
      - main
      - agent/phase-1-core
      - agent/phase-2-gacha-dev2
  pull_request:
    branches:
      - main
      - agent/phase-1-core

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.1'

      - name: Build
        run: gradle build --stacktrace

      - name: Upload JARs
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: emipokemon-${{ github.sha }}
          path: build/libs/*.jar
