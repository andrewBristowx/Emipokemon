name: alpha72-text-visibility-build

on:
  push:
    branches: [release/0.4.0-alpha.72]
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - name: Download exact validated alpha.71 source artifact
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euxo pipefail
          curl -fL --retry 3 --retry-delay 2 \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H 'Accept: application/vnd.github+json' \
            'https://api.github.com/repos/andrewBristowx/Emipokemon/actions/artifacts/9165523193/zip' \
            -o alpha71-artifact.zip
          mkdir alpha71-artifact work
          unzip -q alpha71-artifact.zip -d alpha71-artifact
          echo 'e337f4a0b0768c1529a86f51050765804af670992043aa96b4c91e7ffb8be8ef  alpha71-artifact/Emipokemon-0.4.0-alpha.71-source.zip' | sha256sum -c -
          unzip -q alpha71-artifact/Emipokemon-0.4.0-alpha.71-source.zip -d work
          chmod -R u+rwX work
          grep -q 'mod_version=0.4.0-alpha.71' work/gradle.properties
      - name: Apply alpha.72 text-only patch
        working-directory: work
        run: |
          python3 "$GITHUB_WORKSPACE/ci/alpha72_text.py"
          python3 "$GITHUB_WORKSPACE/ci/alpha72_tests.py"
      - name: Test and build with Java 21
        working-directory: work
        run: |
          set -euxo pipefail
          sed -i 's/\r$//' gradlew
          chmod +x gradlew
          test "$(grep -R '@Test' -h src/test/java | wc -l)" -ge 152
          ./gradlew clean test build --no-daemon --stacktrace
      - name: Verify and package candidate
        shell: bash
        run: |
          set -euxo pipefail
          jar='work/build/libs/emipokemon-0.4.0-alpha.72.jar'
          test -f "$jar"
          unzip -p "$jar" fabric.mod.json | grep -q '0.4.0-alpha.72'
          unzip -l "$jar" | grep -q 'com/emipokemon/client/render/SeasonalPokemonWorldRenderer.class'
          if unzip -l "$jar" | grep -q 'textures/gui/gacha/reveal_sheet.png'; then exit 1; fi
          test "$(unzip -p "$jar" assets/emipokemon/textures/gui/gacha/standard_gacha.png | sha256sum | cut -d' ' -f1)" = '694aadcaca9a8dcaace9c26a9e43cf41e056203855cd380670d0b7c208f4d98d'
          test "$(unzip -p "$jar" assets/emipokemon/textures/gui/gacha/emi_gacha.png | sha256sum | cut -d' ' -f1)" = '4c61d6a00e324a82d060b8c7b9a3abe40daa437fda8d8efb5a4eaf45b973e216'
          test "$(unzip -p "$jar" assets/emipokemon/textures/block/standard_gacha_machine.png | sha256sum | cut -d' ' -f1)" = '42d060134c7809f2617bcf1aa7a06f02750908eb616fcbbfb3b837dbf98e30cd'
          test "$(unzip -p "$jar" assets/emipokemon/textures/block/emi_gacha_machine.png | sha256sum | cut -d' ' -f1)" = '4d0d76caca51f7d167d3197030d7074e9ac2b7e1ade015c5a01c462ef3e4aea0'
          cd work
          zip -qr ../Emipokemon-0.4.0-alpha.72-source.zip . -x 'build/*' '.gradle/*'
          cd ..
          sha256sum "$jar" Emipokemon-0.4.0-alpha.72-source.zip > SHA256SUMS-0.4.0-alpha.72.txt
      - uses: actions/upload-artifact@v4
        with:
          name: Emipokemon-0.4.0-alpha.72-github-build
          path: |
            work/build/libs/emipokemon-0.4.0-alpha.72.jar
            Emipokemon-0.4.0-alpha.72-source.zip
            SHA256SUMS-0.4.0-alpha.72.txt
            work/CHANGELOG-0.4.0-alpha.72.md
          if-no-files-found: error
