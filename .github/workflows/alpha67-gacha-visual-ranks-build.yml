name: alpha67-gacha-visual-ranks-build

on:
  push:
    branches: [release/0.4.0-alpha.67]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - name: Download exact alpha.62 source candidate
        shell: bash
        run: |
          set -euxo pipefail
          curl -fL --retry 3 --retry-delay 2 \
            'https://drive.usercontent.google.com/download?id=1U3KGE4F-Xs1NmxJOpyXALoCD-ZICMhTm&export=download&confirm=t' \
            -o alpha62-source.zip
          echo '56cdf22219db733383da8fc20db48930105167b01571d2ac381a7c1a05e5ba6b  alpha62-source.zip' | sha256sum -c -
          mkdir work
          unzip_rc=0
          unzip -q alpha62-source.zip -d work || unzip_rc=$?
          test "$unzip_rc" -le 1
          chmod -R u+rwX work
      - name: Reconstruct exact alpha.67 candidate
        working-directory: work
        run: |
          python3 "$GITHUB_WORKSPACE/ci/alpha63_core.py"
          python3 "$GITHUB_WORKSPACE/ci/alpha63_tests.py"
          python3 "$GITHUB_WORKSPACE/ci/alpha64_core.py"
          python3 "$GITHUB_WORKSPACE/ci/alpha64_tests.py"
          python3 "$GITHUB_WORKSPACE/ci/alpha65_core.py"
          python3 "$GITHUB_WORKSPACE/ci/alpha65_tests.py"
          python3 "$GITHUB_WORKSPACE/ci/alpha66_core.py"
          python3 "$GITHUB_WORKSPACE/ci/alpha66_tests.py"
          python3 "$GITHUB_WORKSPACE/ci/alpha67_core.py"
          python3 "$GITHUB_WORKSPACE/ci/alpha67_tests.py"
          cp "$GITHUB_WORKSPACE/CHANGELOG-0.4.0-alpha.67.md" .
          cp "$GITHUB_WORKSPACE/GUIA-PRUEBAS-0.4.0-alpha.67.md" .
      - name: Test and build common, server and client with Java 21
        working-directory: work
        run: |
          sed -i 's/\r$//' gradlew
          chmod +x gradlew
          ./gradlew clean test build --no-daemon --stacktrace
      - name: Verify and package candidate
        shell: bash
        run: |
          set -euxo pipefail
          jar='work/build/libs/emipokemon-0.4.0-alpha.67.jar'
          test -f "$jar"
          unzip -p "$jar" fabric.mod.json | grep -q '0.4.0-alpha.67'
          unzip -l "$jar" | grep -q 'GachaScreen.class'
          unzip -l "$jar" | grep -q 'RankGroups.class'
          if unzip -l "$jar" | grep -q 'textures/gui/gacha/reveal_sheet.png'; then exit 1; fi
          cd work
          zip -qr ../Emipokemon-0.4.0-alpha.67-source.zip . -x 'build/*' '.gradle/*'
          cd ..
          sha256sum "$jar" Emipokemon-0.4.0-alpha.67-source.zip > SHA256SUMS-0.4.0-alpha.67.txt
      - uses: actions/upload-artifact@v4
        with:
          name: Emipokemon-0.4.0-alpha.67-github-build
          path: |
            work/build/libs/emipokemon-0.4.0-alpha.67.jar
            Emipokemon-0.4.0-alpha.67-source.zip
            SHA256SUMS-0.4.0-alpha.67.txt
          if-no-files-found: error
