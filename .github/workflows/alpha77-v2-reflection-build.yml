name: alpha77-v2-reflection-build
on:
  push:
    branches: [release/0.4.0-alpha.77]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - name: Reconstruct verified alpha.76 and alpha.77 v2
        run: |
          set -euxo pipefail
          curl -fL --retry 3 'https://drive.usercontent.google.com/download?id=1M87NgfFMAdU7ufg7qCaQGUF6pbl3tHYG&export=download&confirm=t' -o alpha76-source.zip
          echo 'dabac510ee74d3f1fae384d8dd80eef147a17e6d4cfc731456e769d50ad39314  alpha76-source.zip' | sha256sum -c -
          mkdir work && unzip -q alpha76-source.zip -d work
          curl -fL --retry 3 'https://drive.usercontent.google.com/download?id=1dIbktgljzHKO6RWqPswxkVe-eObFIC40&export=download&confirm=t' -o alpha77-overlay.zip
          echo 'a5b00bac3c65dbe8ba10434941a083eabcf34f06317b3c8afc8c1f5e931d76e9  alpha77-overlay.zip' | sha256sum -c -
          unzip -qo alpha77-overlay.zip -d work
          grep -q 'mod_version=0.4.0-alpha.77' work/gradle.properties
      - name: Preflight
        working-directory: work
        run: |
          set -euxo pipefail
          test "$(grep -R '@Test' -h src/test/java | wc -l)" -ge 169
          r='src/client/java/com/emipokemon/client/render/SeasonalPokemonWorldRenderer.java'
          grep -q 'Class.forName(POKEMON_ITEM_CLASS)' "$r"
          grep -q 'Class.forName(POKEMON_ITEM_RENDERER_CLASS)' "$r"
          test "$(grep -c 'import com.cobblemon.mod.common.item.PokemonItem;' "$r" || true)" -eq 0
          grep -q '4.92D + bob' "$r"
          grep -q 'pokemonCatalog().get("eevee")' src/main/java/com/emipokemon/gacha/machine/GachaMachineBlockEntity.java
          grep -q 'currentEmiLegendary()' src/main/java/com/emipokemon/gacha/machine/GachaMachineBlockEntity.java
          grep -q 'textures/item/" + toolId + ".png' src/client/java/com/emipokemon/client/model/EmiToolGeoModel.java
          for n in sword pickaxe axe shovel hoe; do
            grep -q '"texture_width": 32' "src/main/resources/assets/emipokemon/geo/item/emi_${n}.geo.json"
            test "$(grep -c '"origin"' "src/main/resources/assets/emipokemon/geo/item/emi_${n}.geo.json")" -ge 13
          done
          test "$(sha256sum src/main/resources/assets/emipokemon/textures/gui/gacha/standard_gacha.png | cut -d' ' -f1)" = '694aadcaca9a8dcaace9c26a9e43cf41e056203855cd380670d0b7c208f4d98d'
          test "$(sha256sum src/main/resources/assets/emipokemon/textures/gui/gacha/emi_gacha.png | cut -d' ' -f1)" = '4c61d6a00e324a82d060b8c7b9a3abe40daa437fda8d8efb5a4eaf45b973e216'
      - name: Java 21 tests and build
        working-directory: work
        run: |
          set -euxo pipefail
          sed -i 's/\r$//' gradlew && chmod +x gradlew
          ./gradlew clean test build --no-daemon --stacktrace
      - name: Verify and package
        run: |
          set -euxo pipefail
          jar='work/build/libs/emipokemon-0.4.0-alpha.77.jar'
          test -f "$jar"
          unzip -p "$jar" fabric.mod.json | grep -q '0.4.0-alpha.77'
          for e in 'com/emipokemon/client/render/SeasonalPokemonWorldRenderer.class' 'assets/emipokemon/geo/item/emi_sword.geo.json' 'assets/emipokemon/geo/item/emi_pickaxe.geo.json' 'assets/emipokemon/geo/item/emi_axe.geo.json' 'assets/emipokemon/geo/item/emi_shovel.geo.json' 'assets/emipokemon/geo/item/emi_hoe.geo.json'; do unzip -l "$jar" | grep -q "$e"; done
          cd work && zip -qr ../Emipokemon-0.4.0-alpha.77-source.zip . -x 'build/*' '.gradle/*' && cd ..
          sha256sum "$jar" Emipokemon-0.4.0-alpha.77-source.zip > SHA256SUMS-0.4.0-alpha.77.txt
      - uses: actions/upload-artifact@v4
        with:
          name: Emipokemon-0.4.0-alpha.77-v2-build
          path: |
            work/build/libs/emipokemon-0.4.0-alpha.77.jar
            Emipokemon-0.4.0-alpha.77-source.zip
            SHA256SUMS-0.4.0-alpha.77.txt
            work/CHANGELOG-0.4.0-alpha.77.md
            work/GUIA-PRUEBAS-0.4.0-alpha.77.md
          if-no-files-found: error
