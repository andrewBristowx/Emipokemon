name: Build Emipokemon 0.5.0-alpha.11 dungeon content

on:
  push:
    branches:
      - release/0.5.0-alpha.11
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Restore exact alpha.10 source
        shell: bash
        run: |
          set -euxo pipefail
          curl -fL --retry 3 --retry-delay 2 'https://drive.usercontent.google.com/download?id=18v0GLohI5mmVKQeaeBwLFe4C0mnANixN&export=download&confirm=t' -o Emipokemon-0.5.0-alpha.10-source.zip
          echo '2a70bc766c93f836e6ffdb6764058114020550cf8975a45a269316229560cb88  Emipokemon-0.5.0-alpha.10-source.zip' | sha256sum -c -
          mkdir emipokemon
          unzip -q Emipokemon-0.5.0-alpha.10-source.zip -d emipokemon

      - name: Apply alpha.11 dungeon content overlay
        shell: bash
        run: |
          set -euxo pipefail
          cat ci/alpha11-overlay.part* | base64 -d > alpha11-overlay.tar.xz
          echo '93013a73d7a09074f1e1e6602850de75d08f6f33a426142d09978a2780a7cc14  alpha11-overlay.tar.xz' | sha256sum -c -
          tar -xJf alpha11-overlay.tar.xz -C emipokemon

      - name: Validate protected systems and dungeon integration
        working-directory: emipokemon
        shell: bash
        run: |
          set -euxo pipefail
          grep -q 'mod_version=0.5.0-alpha.11' gradle.properties
          grep -q 'VERSION = "0.5.0-alpha.11"' src/main/java/com/emipokemon/Emipokemon.java
          grep -q 'professor_emi_v4.png' src/main/java/com/emipokemon/admin/ProfessorNetworking.java
          echo '5fedf1a66542bbc16c5786d667c92b220da086d4c43404accccec836c2fb3a64  src/main/resources/assets/emipokemon/textures/entity/professor_emi_v4.png' | sha256sum -c -
          grep -q 'DungeonTrainerService.initialize()' src/main/java/com/emipokemon/Emipokemon.java
          grep -q 'DungeonTrainerService.scaledTeam(player, npc)' src/main/java/com/emipokemon/npc/NpcBattleService.java
          grep -q 'DungeonTrainerService.canChallenge(player, npc, true)' src/main/java/com/emipokemon/npc/NpcBattleService.java
          grep -q 'DungeonTrainerService.onVictory(player, active.npc())' src/main/java/com/emipokemon/npc/NpcBattleService.java
          grep -q 'EmipokemonDungeonRole' src/main/java/com/emipokemon/npc/ServiceNpcEntity.java
          grep -q 'defeatedDungeonTrainers' src/main/java/com/emipokemon/data/PlayerData.java
          grep -q 'clearedDungeons' src/main/java/com/emipokemon/data/PlayerData.java
          grep -q 'GUARDIAN' src/main/java/com/emipokemon/dungeon/DungeonTrainerService.java
          grep -q 'npc.setBattleRewards(List.of())' src/main/java/com/emipokemon/dungeon/DungeonTrainerService.java
          grep -q 'pokemonCatalog().get("eevee")' src/main/java/com/emipokemon/gacha/machine/GachaMachineBlockEntity.java
          ! grep -q 'rctmod player set series' src/main/java/com/emipokemon/admin/PlayerResetService.java
          echo '1540614909181e432680a0860ed39702553929919b45b7681155b07d981e078b  src/main/resources/assets/emipokemon/textures/item/emi_sword.png' | sha256sum -c -
          echo '6954d581169275d213046e41772a57f934ab0ffd84f311e2ea6fc344e0d0c1d7  src/main/resources/assets/emipokemon/textures/item/emi_pickaxe.png' | sha256sum -c -
          echo 'fe9d4f5d41e86122fcf040f5381bf173e0b0f5334a7314f95ce5a89e2a96774a  src/main/resources/assets/emipokemon/textures/item/emi_axe.png' | sha256sum -c -
          echo 'f528d40ff3f1cd947b5a6e2b8bbea9e5a0b2f4bbbec17b4eaaabf0a5d484399a  src/main/resources/assets/emipokemon/textures/item/emi_shovel.png' | sha256sum -c -
          echo '946b14b5ce1f31295c8be2cc401aff91bc63173051f10e8d6de6e6fde3690ca2  src/main/resources/assets/emipokemon/textures/item/emi_hoe.png' | sha256sum -c -

      - name: Package source snapshot
        shell: bash
        run: |
          set -euxo pipefail
          (cd emipokemon && zip -qr ../Emipokemon-0.5.0-alpha.11-source.zip . -x '.gradle/*' 'build/*')

      - name: Compile Emipokemon
        working-directory: emipokemon
        shell: bash
        run: |
          set -euxo pipefail
          sed -i 's/\r$//' gradlew && chmod +x gradlew
          ./gradlew clean build -x test --no-daemon --stacktrace

      - name: Run regression tests
        working-directory: emipokemon
        shell: bash
        run: |
          set -euxo pipefail
          ./gradlew test \
            --tests com.emipokemon.v050a11.Version050Alpha11RegressionTest \
            --tests com.emipokemon.challenge.ChallengeCatalogTest \
            --tests com.emipokemon.progress.QuestCatalogTest \
            --tests com.emipokemon.data.PlayerDataMigrationTest \
            --tests com.emipokemon.alpha98.Alpha98VanillaHandheldToolsRegressionTest \
            --tests com.emipokemon.alpha90.Alpha90HeartUvRegressionTest \
            --no-daemon --stacktrace

      - name: Verify final jar
        shell: bash
        run: |
          set -euxo pipefail
          jar='emipokemon/build/libs/emipokemon-0.5.0-alpha.11.jar'
          test -f "$jar"
          unzip -p "$jar" fabric.mod.json | grep -q '0.5.0-alpha.11'
          unzip -l "$jar" | grep -q 'com/emipokemon/dungeon/DungeonTrainerService.class'
          unzip -l "$jar" | grep -q 'com/emipokemon/npc/ServiceNpcEntity.class'
          unzip -l "$jar" | grep -q 'com/emipokemon/data/PlayerData.class'
          sha256sum "$jar" Emipokemon-0.5.0-alpha.11-source.zip > SHA256SUMS-0.5.0-alpha.11.txt
          cat SHA256SUMS-0.5.0-alpha.11.txt

      - uses: actions/upload-artifact@v4
        with:
          name: Emipokemon-0.5.0-alpha.11-dungeon-content
          path: |
            emipokemon/build/libs/emipokemon-0.5.0-alpha.11.jar
            Emipokemon-0.5.0-alpha.11-source.zip
            emipokemon/CHANGELOG-0.5.0-alpha.11.md
            emipokemon/GUIA-PRUEBAS-0.5.0-alpha.11.md
            SHA256SUMS-0.5.0-alpha.11.txt
          if-no-files-found: error
