name: alpha74-cleanlabels-featured-build

on:
  push:
    branches: [release/0.4.0-alpha.74]
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Download exact validated alpha.73 source artifact
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euxo pipefail
          curl -fL --retry 3 --retry-delay 2 \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H 'Accept: application/vnd.github+json' \
            'https://api.github.com/repos/andrewBristowx/Emipokemon/actions/artifacts/9168142601/zip' \
            -o alpha73-artifact.zip
          mkdir alpha73-artifact work
          unzip -q alpha73-artifact.zip -d alpha73-artifact
          source_zip="$(find alpha73-artifact -type f -name 'Emipokemon-0.4.0-alpha.73-source.zip' -print -quit)"
          test -n "$source_zip"
          echo '6b161abc767c3dfe2b546dc5def8d1a54a0aef48268383fc734e733cd2772477  '"$source_zip" | sha256sum -c -
          unzip -q "$source_zip" -d work
          chmod -R u+rwX work
          grep -q 'mod_version=0.4.0-alpha.73' work/gradle.properties

      - name: Apply alpha.74 clean labels and featured Pokemon patch
        working-directory: work
        run: |
          set -euxo pipefail
          python3 "$GITHUB_WORKSPACE/ci/alpha74_clean_labels_featured_pokemon.py"
          python3 "$GITHUB_WORKSPACE/ci/alpha74_test_compat.py"
          grep -q 'mod_version=0.4.0-alpha.74' gradle.properties
          grep -q 'nbt.putString("billboard", "fixed")' src/main/java/com/emipokemon/gacha/machine/GachaMachineLabelService.java
          grep -q 'nbt.putByte("shadow", (byte) 0)' src/main/java/com/emipokemon/gacha/machine/GachaMachineLabelService.java
          grep -q 'nbt.putInt("background", 0x00000000)' src/main/java/com/emipokemon/hologram/VanillaTextHologram.java
          grep -q 'matrices.translate(0.5D, 4.18D + bob, 0.5D)' src/client/java/com/emipokemon/client/render/SeasonalPokemonWorldRenderer.java
          ! grep -q 'client.gameRenderer.getCamera().getYaw()' src/client/java/com/emipokemon/client/render/SeasonalPokemonWorldRenderer.java

      - name: Test and build with Java 21
        working-directory: work
        run: |
          set -euxo pipefail
          sed -i 's/\r$//' gradlew
          chmod +x gradlew
          test "$(grep -R '@Test' -h src/test/java | wc -l)" -ge 159
          ./gradlew clean test build --no-daemon --stacktrace

      - name: Verify and package alpha.74 candidate
        shell: bash
        run: |
          set -euxo pipefail
          jar='work/build/libs/emipokemon-0.4.0-alpha.74.jar'
          test -f "$jar"
          unzip -p "$jar" fabric.mod.json | grep -q '0.4.0-alpha.74'
          for entry in \
            'com/emipokemon/gacha/machine/GachaMachineLabelService.class' \
            'com/emipokemon/client/render/SeasonalPokemonWorldRenderer.class' \
            'com/emipokemon/hologram/VanillaTextHologram.class' \
            'com/emipokemon/client/render/HologramRenderer.class' \
            'com/emipokemon/client/emote/EmotesButtonWidget.class'; do
            unzip -l "$jar" | grep -q "$entry"
          done
          test "$(unzip -p "$jar" assets/emipokemon/textures/gui/gacha/standard_gacha.png | sha256sum | cut -d' ' -f1)" = '694aadcaca9a8dcaace9c26a9e43cf41e056203855cd380670d0b7c208f4d98d'
          test "$(unzip -p "$jar" assets/emipokemon/textures/gui/gacha/emi_gacha.png | sha256sum | cut -d' ' -f1)" = '4c61d6a00e324a82d060b8c7b9a3abe40daa437fda8d8efb5a4eaf45b973e216'
          test "$(unzip -p "$jar" assets/emipokemon/textures/block/standard_gacha_machine.png | sha256sum | cut -d' ' -f1)" = '42d060134c7809f2617bcf1aa7a06f02750908eb616fcbbfb3b837dbf98e30cd'
          test "$(unzip -p "$jar" assets/emipokemon/textures/block/emi_gacha_machine.png | sha256sum | cut -d' ' -f1)" = '4d0d76caca51f7d167d3197030d7074e9ac2b7e1ade015c5a01c462ef3e4aea0'
          cd work
          zip -qr ../Emipokemon-0.4.0-alpha.74-source.zip . -x 'build/*' '.gradle/*'
          cd ..
          sha256sum "$jar" Emipokemon-0.4.0-alpha.74-source.zip > SHA256SUMS-0.4.0-alpha.74.txt

      - uses: actions/upload-artifact@v4
        with:
          name: Emipokemon-0.4.0-alpha.74-github-build
          path: |
            work/build/libs/emipokemon-0.4.0-alpha.74.jar
            Emipokemon-0.4.0-alpha.74-source.zip
            SHA256SUMS-0.4.0-alpha.74.txt
            work/CHANGELOG-0.4.0-alpha.74.md
            work/GUIA-PRUEBAS-0.4.0-alpha.74.md
          if-no-files-found: error
