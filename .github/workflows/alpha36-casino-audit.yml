name: alpha36-casino-audit

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Download and reconstruct alpha.35
        shell: bash
        run: |
          set -euxo pipefail
          curl -fL --retry 3 --retry-delay 2 'https://drive.usercontent.google.com/download?id=1hW1-TH2UK6c2BIwZae7ux6zSM3opL10N&export=download&confirm=t' -o alpha27-source.zip
          echo 'a7e5545668760f84d036ee017622d32d9b8fa0ffe4b77cfdae10d40c820abf4b  alpha27-source.zip' | sha256sum -c -
          rm -rf work ci-history && mkdir work ci-history
          unzip -q alpha27-source.zip -d work
          base34='https://raw.githubusercontent.com/andrewBristowx/Emipokemon/2494bdfcbaa1b282962178d67d82ad136b404811/ci'
          for f in alpha29_apply.py alpha30_apply.py alpha31_apply.py alpha31_compile_fix.py alpha32_client_path.py alpha32_apply.py alpha33_apply.py alpha34_apply.py alpha34_test_fix.py; do curl -fL --retry 3 "$base34/$f" -o "ci-history/$f"; done
          curl -fL --retry 3 'https://raw.githubusercontent.com/andrewBristowx/Emipokemon/56eca300953a194b13596c17f064430c7f383ded/ci/alpha35_apply.py' -o ci-history/alpha35_apply.py
          cd work
          for f in alpha29_apply.py alpha30_apply.py alpha31_apply.py alpha31_compile_fix.py alpha32_client_path.py alpha32_apply.py; do python3 "$GITHUB_WORKSPACE/ci-history/$f"; done
          rm -f src/client/java/com/emipokemon/EmipokemonClient.java
          for f in alpha33_apply.py alpha34_apply.py alpha34_test_fix.py alpha35_apply.py; do python3 "$GITHUB_WORKSPACE/ci-history/$f"; done
      - name: Print exact economy mutation internals
        shell: bash
        working-directory: work
        run: |
          set -euo pipefail
          f=src/main/java/com/emipokemon/progress/ProgressionService.java
          grep -n -A100 -B20 'private long credit' "$f" || true
          grep -n -A100 -B20 'private boolean debit' "$f" || true
          grep -n -A70 -B20 'void playerLeft' "$f" || true
          grep -RIn 'ServerPlayConnectionEvents' src/main/java || true
