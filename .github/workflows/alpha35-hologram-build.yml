name: alpha35-build

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Download exact alpha.27 source archive
        shell: bash
        run: |
          set -euxo pipefail
          curl -fL --retry 3 --retry-delay 2 \
            'https://drive.usercontent.google.com/download?id=1hW1-TH2UK6c2BIwZae7ux6zSM3opL10N&export=download&confirm=t' \
            -o alpha27-source.zip
          echo 'a7e5545668760f84d036ee017622d32d9b8fa0ffe4b77cfdae10d40c820abf4b  alpha27-source.zip' | sha256sum -c -
          rm -rf work ci-history
          mkdir work ci-history
          unzip -q alpha27-source.zip -d work

      - name: Fetch exact alpha.29-alpha.34 transform history
        shell: bash
        run: |
          set -euxo pipefail
          base='https://raw.githubusercontent.com/andrewBristowx/Emipokemon/2494bdfcbaa1b282962178d67d82ad136b404811/ci'
          for f in alpha29_apply.py alpha30_apply.py alpha31_apply.py alpha31_compile_fix.py alpha32_client_path.py alpha32_apply.py alpha33_apply.py alpha34_apply.py alpha34_test_fix.py; do
            curl -fL --retry 3 "$base/$f" -o "ci-history/$f"
          done

      - name: Apply alpha.29 through alpha.35 source transforms
        shell: bash
        working-directory: work
        run: |
          set -euxo pipefail
          python3 "$GITHUB_WORKSPACE/ci-history/alpha29_apply.py"
          python3 "$GITHUB_WORKSPACE/ci-history/alpha30_apply.py"
          python3 "$GITHUB_WORKSPACE/ci-history/alpha31_apply.py"
          python3 "$GITHUB_WORKSPACE/ci-history/alpha31_compile_fix.py"
          python3 "$GITHUB_WORKSPACE/ci-history/alpha32_client_path.py"
          python3 "$GITHUB_WORKSPACE/ci-history/alpha32_apply.py"
          rm -f src/client/java/com/emipokemon/EmipokemonClient.java
          python3 "$GITHUB_WORKSPACE/ci-history/alpha33_apply.py"
          python3 "$GITHUB_WORKSPACE/ci-history/alpha34_apply.py"
          python3 "$GITHUB_WORKSPACE/ci-history/alpha34_test_fix.py"
          python3 "$GITHUB_WORKSPACE/ci/alpha35_apply.py"

      - name: Verify alpha.35 source identity
        shell: bash
        run: |
          set -euxo pipefail
          grep -q '^mod_version=0.4.0-alpha.35' work/gradle.properties
          grep -q 'EntityTrackingEvents.START_TRACKING' work/src/main/java/com/emipokemon/hologram/HologramViewerTextService.java
          grep -q 'EntityTrackingEvents.STOP_TRACKING' work/src/main/java/com/emipokemon/hologram/HologramViewerTextService.java
          ! grep -q 'ticks - previous.tick() < 100L' work/src/main/java/com/emipokemon/hologram/HologramViewerTextService.java
          grep -q 'HologramStreamotesClientService.resolve(data.text())' work/src/client/java/com/emipokemon/client/mixin/TextDisplayHologramMixin.java
          grep -q 'data.flags() & ~0x02' work/src/client/java/com/emipokemon/client/mixin/TextDisplayHologramMixin.java
          grep -q 'chatScreen.setFocused(field);' work/src/client/java/com/emipokemon/client/emote/ChatEmoteController.java
          ! grep -q 'public void setFocused(boolean focused)' work/src/client/java/com/emipokemon/client/emote/EmotesButtonWidget.java

      - name: Normalize Gradle wrapper
        shell: bash
        working-directory: work
        run: |
          sed -i 's/\r$//' gradlew
          chmod +x gradlew

      - name: Test and build with Java 21
        shell: bash
        working-directory: work
        run: ./gradlew clean test build --no-daemon --stacktrace

      - name: Verify built version and generate checksums
        shell: bash
        run: |
          set -euxo pipefail
          test -f work/build/libs/emipokemon-0.4.0-alpha.35.jar
          unzip -p work/build/libs/emipokemon-0.4.0-alpha.35.jar fabric.mod.json | grep -q '0.4.0-alpha.35'
          sha256sum work/build/libs/*.jar | tee SHA256SUMS-0.4.0-alpha.35-github.txt

      - name: Upload alpha.35 build
        uses: actions/upload-artifact@v4
        with:
          name: Emipokemon-0.4.0-alpha.35-github-build
          path: |
            work/build/libs/*.jar
            SHA256SUMS-0.4.0-alpha.35-github.txt
          if-no-files-found: error
