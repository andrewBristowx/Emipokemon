name: alpha78-build

on:
  push:
    branches: [release/0.4.0-alpha.78]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Apply exact alpha.78 patch to alpha.77 base
        shell: bash
        run: |
          set -euxo pipefail
          find . -type f \( -name '*.java' -o -name '*.json' -o -name '*.md' -o -name '*.properties' -o -name '*.gradle' -o -name '*.yml' -o -name '*.yaml' -o -name '*.txt' \) -not -path './.git/*' -exec sed -i 's/\r$//' {} +
          curl -fL --retry 3 --retry-delay 2 \
            'https://drive.usercontent.google.com/download?id=131B5np_e_Ak-e2mmOZoBZ70lJjcPEsL7&export=download&confirm=t' \
            -o alpha78.patch
          echo '6597707860f304713d1ab4c95570535c4bc8570572f555451600a89c00770a50  alpha78.patch' | sha256sum -c -
          patch -p1 --forward < alpha78.patch
          grep -q 'mod_version=0.4.0-alpha.78' gradle.properties
          grep -q '0.4.0-alpha.78' src/main/java/com/emipokemon/Emipokemon.java

      - name: Preflight alpha.78 changes
        shell: bash
        run: |
          set -euxo pipefail
          grep -q '"GASHA NORMAL"' src/client/java/com/emipokemon/client/render/SeasonalPokemonWorldRenderer.java
          grep -q 'machine.isEmiThemed() ? 1.7F : 1.5F' src/client/java/com/emipokemon/client/render/SeasonalPokemonWorldRenderer.java
          grep -q '5.02D + bob' src/client/java/com/emipokemon/client/render/SeasonalPokemonWorldRenderer.java
          grep -q 'forceEmiLegendary' src/main/java/com/emipokemon/gacha/banner/FeaturedRotationService.java
          grep -q 'literal("featured")' src/main/java/com/emipokemon/command/GachaCommands.java
          grep -q 'literal("force")' src/main/java/com/emipokemon/command/GachaCommands.java
          grep -q 'literal("clear")' src/main/java/com/emipokemon/command/GachaCommands.java
          for n in sword pickaxe axe shovel hoe; do
            grep -q '"parent": "builtin/entity"' "src/main/resources/assets/emipokemon/models/item/emi_${n}.json"
            grep -q '0.56' "src/main/resources/assets/emipokemon/models/item/emi_${n}.json"
            test -f "src/main/resources/assets/emipokemon/geo/item/emi_${n}.geo.json"
          done
          test "$(sha256sum src/main/resources/assets/emipokemon/textures/gui/gacha/standard_gacha.png | cut -d' ' -f1)" = '694aadcaca9a8dcaace9c26a9e43cf41e056203855cd380670d0b7c208f4d98d'
          test "$(sha256sum src/main/resources/assets/emipokemon/textures/gui/gacha/emi_gacha.png | cut -d' ' -f1)" = '4c61d6a00e324a82d060b8c7b9a3abe40daa437fda8d8efb5a4eaf45b973e216'
          test ! -f src/main/resources/assets/emipokemon/textures/gui/gacha/reveal_sheet.png

      - name: Test and build with Java 21
        shell: bash
        run: |
          set -euxo pipefail
          sed -i 's/\r$//' gradlew
          chmod +x gradlew
          ./gradlew clean test build --no-daemon --stacktrace

      - name: Verify and package alpha.78
        shell: bash
        run: |
          set -euxo pipefail
          jar='build/libs/emipokemon-0.4.0-alpha.78.jar'
          test -f "$jar"
          unzip -p "$jar" fabric.mod.json | grep -q '0.4.0-alpha.78'
          unzip -l "$jar" | grep -q 'com/emipokemon/client/render/SeasonalPokemonWorldRenderer.class'
          unzip -l "$jar" | grep -q 'com/emipokemon/gacha/banner/FeaturedRotationService.class'
          unzip -l "$jar" | grep -q 'com/emipokemon/command/GachaCommands.class'
          if unzip -l "$jar" | grep -q 'textures/gui/gacha/reveal_sheet.png'; then exit 1; fi
          zip -qr Emipokemon-0.4.0-alpha.78-source.zip . -x '.git/*' '.gradle/*' 'build/*' 'alpha78.patch' 'Emipokemon-0.4.0-alpha.78-source.zip'
          sha256sum "$jar" Emipokemon-0.4.0-alpha.78-source.zip > SHA256SUMS-0.4.0-alpha.78.txt

      - uses: actions/upload-artifact@v4
        with:
          name: Emipokemon-0.4.0-alpha.78-github-build
          path: |
            build/libs/emipokemon-0.4.0-alpha.78.jar
            Emipokemon-0.4.0-alpha.78-source.zip
            SHA256SUMS-0.4.0-alpha.78.txt
            CHANGELOG-0.4.0-alpha.78.md
            GUIA-PRUEBAS-0.4.0-alpha.78.md
          if-no-files-found: error
