name: Build Emipokemon 0.5.0-alpha.13 accepted Pokemon

on:
  push:
    branches:
      - release/0.5.0-alpha.13
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Restore exact alpha.12 source from successful artifact
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euxo pipefail
          curl -fL --retry 3 --retry-delay 2 \
            -H "Authorization: Bearer $GITHUB_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            'https://api.github.com/repos/andrewBristowx/Emipokemon/actions/artifacts/9255742719/zip' \
            -o alpha12-artifact.zip
          mkdir alpha12-artifact
          unzip -q alpha12-artifact.zip -d alpha12-artifact
          srczip="$(find alpha12-artifact -name 'Emipokemon-0.5.0-alpha.12-source.zip' -print -quit)"
          test -n "$srczip"
          mkdir emipokemon
          unzip -q "$srczip" -d emipokemon

      - name: Apply alpha.13 accepted Pokemon overlay
        shell: bash
        run: |
          set -euxo pipefail
          cat ci/alpha13-overlay.part* | base64 -d > alpha13-overlay.tar.xz
          echo '6c79f8228d4e274bc91552971939df7435dec887bda25a7957e8bc40a0800e98  alpha13-overlay.tar.xz' | sha256sum -c -
          tar -xJf alpha13-overlay.tar.xz -C emipokemon

      - name: Download official Cobblemon 1.7.3 Fabric data source
        shell: bash
        run: |
          set -euxo pipefail
          curl -fL --retry 3 --retry-delay 2 'https://api.modrinth.com/v2/version/kF7CvxTo' -o cobblemon-version.json
          python - <<'PY'
          import json, urllib.request
          d=json.load(open('cobblemon-version.json'))
          files=d['files']
          chosen=next((f for f in files if f.get('primary') and 'fabric' in f['filename'].lower()), None)
          if chosen is None:
              chosen=next(f for f in files if 'fabric' in f['filename'].lower())
          print(chosen['url'])
          urllib.request.urlretrieve(chosen['url'], 'Cobblemon-1.7.3-fabric.jar')
          PY
          test -s Cobblemon-1.7.3-fabric.jar

      - name: Generate accepted Emi species from official Cobblemon data
        working-directory: emipokemon
        shell: bash
        run: |
          set -euxo pipefail
          python tools/generate_emi_species.py ../Cobblemon-1.7.3-fabric.jar .
          for id in unown_6 unown_7 unown_67 espurr_emi meowstic_emi sprigatito_emi floragato_emi meowscarada_emi zorua_emi zoroark_emi; do
            test -f "src/main/resources/data/emipokemon/species/custom/$id.json"
          done
          grep -q 'emipokemon:floragato_emi' src/main/resources/data/emipokemon/species/custom/sprigatito_emi.json
          grep -q 'emipokemon:meowscarada_emi' src/main/resources/data/emipokemon/species/custom/floragato_emi.json
          grep -q 'emipokemon:zoroark_emi' src/main/resources/data/emipokemon/species/custom/zorua_emi.json
          grep -q 'emipokemon:meowstic_emi' src/main/resources/data/emipokemon/species/custom/espurr_emi.json

      - name: Validate protected alpha.12 systems and new gasha integration
        working-directory: emipokemon
        shell: bash
        run: |
          set -euxo pipefail
          grep -q 'mod_version=0.5.0-alpha.13' gradle.properties
          grep -q 'VERSION = "0.5.0-alpha.13"' src/main/java/com/emipokemon/Emipokemon.java
          grep -q 'dungeonLevelSyncConfig' src/main/java/com/emipokemon/npc/NpcBattleService.java
          grep -q 'EMI_ACCEPTED_VARIANTS' src/main/java/com/emipokemon/gacha/banner/BannerManager.java
          grep -q 'meowscarada_emi' src/main/java/com/emipokemon/gacha/catalog/PokemonCatalogService.java
          grep -q 'filter(entry -> !entry.labels().contains("custom"))' src/main/java/com/emipokemon/gacha/banner/FeaturedRotationService.java
          echo '1540614909181e432680a0860ed39702553929919b45b7681155b07d981e078b  src/main/resources/assets/emipokemon/textures/item/emi_sword.png' | sha256sum -c -
          echo '6954d581169275d213046e41772a57f934ab0ffd84f311e2ea6fc344e0d0c1d7  src/main/resources/assets/emipokemon/textures/item/emi_pickaxe.png' | sha256sum -c -
          echo 'fe9d4f5d41e86122fcf040f5381bf173e0b0f5334a7314f95ce5a89e2a96774a  src/main/resources/assets/emipokemon/textures/item/emi_axe.png' | sha256sum -c -
          echo 'f528d40ff3f1cd947b5a6e2b8bbea9e5a0b2f4bbbec17b4eaaabf0a5d484399a  src/main/resources/assets/emipokemon/textures/item/emi_shovel.png' | sha256sum -c -
          echo '946b14b5ce1f31295c8be2cc401aff91bc63173051f10e8d6de6e6fde3690ca2  src/main/resources/assets/emipokemon/textures/item/emi_hoe.png' | sha256sum -c -

      - name: Package source snapshot
        shell: bash
        run: |
          set -euxo pipefail
          (cd emipokemon && zip -qr ../Emipokemon-0.5.0-alpha.13-source.zip . -x '.gradle/*' 'build/*')

      - name: Compile Emipokemon
        working-directory: emipokemon
        shell: bash
        run: |
          set -euxo pipefail
          sed -i 's/\r$//' gradlew && chmod +x gradlew
          ./gradlew clean build -x test --no-daemon --stacktrace

      - name: Run regression tests
        working-directory: emipokemon
        shell: bash
        run: |
          set -euxo pipefail
          ./gradlew test \
            --tests com.emipokemon.v050a13.Version050Alpha13RegressionTest \
            --tests com.emipokemon.challenge.ChallengeCatalogTest \
            --tests com.emipokemon.progress.QuestCatalogTest \
            --tests com.emipokemon.data.PlayerDataMigrationTest \
            --tests com.emipokemon.alpha98.Alpha98VanillaHandheldToolsRegressionTest \
            --tests com.emipokemon.alpha90.Alpha90HeartUvRegressionTest \
            --no-daemon --stacktrace

      - name: Verify final jar
        shell: bash
        run: |
          set -euxo pipefail
          jar='emipokemon/build/libs/emipokemon-0.5.0-alpha.13.jar'
          test -f "$jar"
          unzip -p "$jar" fabric.mod.json | grep -q '0.5.0-alpha.13'
          for id in unown_6 unown_7 unown_67 espurr_emi meowstic_emi sprigatito_emi floragato_emi meowscarada_emi zorua_emi zoroark_emi; do
            unzip -l "$jar" | grep -q "data/emipokemon/species/custom/$id.json"
            unzip -l "$jar" | grep -q "assets/cobblemon/bedrock/pokemon/resolvers/$id/0_${id}_base.json"
          done
          unzip -l "$jar" | grep -q 'assets/cobblemon/textures/pokemon/meowstic_emi/meowstic_emi_female_shiny.png'
          sha256sum "$jar" Emipokemon-0.5.0-alpha.13-source.zip > SHA256SUMS-0.5.0-alpha.13.txt
          cat SHA256SUMS-0.5.0-alpha.13.txt

      - uses: actions/upload-artifact@v4
        with:
          name: Emipokemon-0.5.0-alpha.13-accepted-pokemon
          path: |
            emipokemon/build/libs/emipokemon-0.5.0-alpha.13.jar
            Emipokemon-0.5.0-alpha.13-source.zip
            emipokemon/CHANGELOG-0.5.0-alpha.13.md
            emipokemon/GUIA-PRUEBAS-0.5.0-alpha.13.md
            SHA256SUMS-0.5.0-alpha.13.txt
          if-no-files-found: error
