name: Build Emipokemon 0.5.0-alpha.7

on:
  push:
    branches:
      - release/0.5.0-alpha.7
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Restore exact 0.5.0-alpha.7 source
        shell: bash
        run: |
          set -euxo pipefail
          curl -fL --retry 3 --retry-delay 2 \
            'https://drive.usercontent.google.com/download?id=1-EhLxEr_K738JJSBGmW09SyaMj6yvhfZ&export=download&confirm=t' \
            -o Emipokemon-0.5.0-alpha.7-source.zip
          echo '2cfebeeeafedeaf1020bece7cfa1fc47819ceacc62ad6709f87bd7fe5bec6870  Emipokemon-0.5.0-alpha.7-source.zip' | sha256sum -c -
          mkdir work
          unzip -q Emipokemon-0.5.0-alpha.7-source.zip -d work
          grep -q 'mod_version=0.5.0-alpha.7' work/gradle.properties
          grep -q 'VERSION = "0.5.0-alpha.7"' work/src/main/java/com/emipokemon/Emipokemon.java

      - name: Validate alpha.7 fixes and protected assets
        working-directory: work
        shell: bash
        run: |
          set -euxo pipefail
          grep -q 'PokemonSpecies.getByIdentifier(identifier)' src/client/java/com/emipokemon/client/render/SeasonalPokemonWorldRenderer.java
          grep -q 'if (professor) return selectedFallback' src/client/java/com/emipokemon/client/render/CustomNpcRenderer.java
          grep -q 'RegistryKeys.STRUCTURE' src/main/java/com/emipokemon/admin/RegionalStructureAuditService.java
          grep -q 'literal("structures")' src/main/java/com/emipokemon/command/EmipokemonCommands.java
          ! grep -q 'rctmod player set series kanto' src/main/java/com/emipokemon/admin/PlayerResetService.java
          echo '1540614909181e432680a0860ed39702553929919b45b7681155b07d981e078b  src/main/resources/assets/emipokemon/textures/item/emi_sword.png' | sha256sum -c -
          echo '6954d581169275d213046e41772a57f934ab0ffd84f311e2ea6fc344e0d0c1d7  src/main/resources/assets/emipokemon/textures/item/emi_pickaxe.png' | sha256sum -c -
          echo 'fe9d4f5d41e86122fcf040f5381bf173e0b0f5334a7314f95ce5a89e2a96774a  src/main/resources/assets/emipokemon/textures/item/emi_axe.png' | sha256sum -c -
          echo 'f528d40ff3f1cd947b5a6e2b8bbea9e5a0b2f4bbbec17b4eaaabf0a5d484399a  src/main/resources/assets/emipokemon/textures/item/emi_shovel.png' | sha256sum -c -
          echo '946b14b5ce1f31295c8be2cc401aff91bc63173051f10e8d6de6e6fde3690ca2  src/main/resources/assets/emipokemon/textures/item/emi_hoe.png' | sha256sum -c -

      - name: Compile with Java 21
        working-directory: work
        shell: bash
        run: |
          set -euxo pipefail
          sed -i 's/\r$//' gradlew
          chmod +x gradlew
          ./gradlew clean build -x test --no-daemon --stacktrace

      - name: Run alpha.7 and inherited regression tests
        working-directory: work
        shell: bash
        run: |
          set -euxo pipefail
          ./gradlew test \
            --tests com.emipokemon.v050a7.Version050Alpha7RegressionTest \
            --tests com.emipokemon.alpha75.Alpha75WorldPokemonDisplayRegressionTest \
            --tests com.emipokemon.challenge.ChallengeCatalogTest \
            --tests com.emipokemon.progress.QuestCatalogTest \
            --tests com.emipokemon.data.PlayerDataMigrationTest \
            --tests com.emipokemon.alpha98.Alpha98VanillaHandheldToolsRegressionTest \
            --tests com.emipokemon.alpha90.Alpha90HeartUvRegressionTest \
            --no-daemon --stacktrace

      - name: Verify final jar
        shell: bash
        run: |
          set -euxo pipefail
          jar='work/build/libs/emipokemon-0.5.0-alpha.7.jar'
          test -f "$jar"
          unzip -p "$jar" fabric.mod.json | grep -q '0.5.0-alpha.7'
          unzip -l "$jar" | grep -q 'com/emipokemon/admin/RegionalStructureAuditService.class'
          unzip -l "$jar" | grep -q 'assets/emipokemon/textures/entity/professor_emi.png'
          unzip -l "$jar" | grep -q 'assets/cobblemon/bedrock/pokemon/models/eevee_gatito/eevee_gatito.geo.json'
          sha256sum "$jar" Emipokemon-0.5.0-alpha.7-source.zip > SHA256SUMS-0.5.0-alpha.7.txt

      - uses: actions/upload-artifact@v4
        with:
          name: Emipokemon-0.5.0-alpha.7-github-build
          path: |
            work/build/libs/emipokemon-0.5.0-alpha.7.jar
            Emipokemon-0.5.0-alpha.7-source.zip
            SHA256SUMS-0.5.0-alpha.7.txt
          if-no-files-found: error
