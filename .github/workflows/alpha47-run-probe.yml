name: alpha47-run-probe

on:
  push:
    branches: [release/0.4.0-alpha.47]
  workflow_dispatch:

permissions:
  actions: read
  contents: read
  issues: write
  pull-requests: write

jobs:
  report:
    runs-on: ubuntu-latest
    steps:
      - name: Report workflow run ids to PR 27
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          sleep 8
          {
            echo 'ALPHA47_RUN_PROBE'
            echo "head_sha=${GITHUB_SHA}"
            gh api "repos/andrewBristowx/Emipokemon/actions/runs?head_sha=${GITHUB_SHA}&per_page=30" --jq '.workflow_runs[] | "run_id=\(.id) name=\(.name) status=\(.status) conclusion=\(.conclusion // \"-\")"'
          } > probe.txt
          gh pr comment 27 --repo andrewBristowx/Emipokemon --body-file probe.txt
