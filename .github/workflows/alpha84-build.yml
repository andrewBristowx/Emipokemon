name: alpha84-build

on:
  push:
    branches: [release/0.4.0-alpha.84]
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Restore exact alpha.84 source
        shell: bash
        run: |
          set -euxo pipefail
          curl -fL --retry 3 --retry-delay 2 \
            'https://drive.usercontent.google.com/download?id=1TIx3E1o4XvnrhJ6GnIpgnoYfsfrrX1JT&export=download&confirm=t' \
            -o alpha84-source.zip
          echo '210749e0c0259470d34627673936632df61b0b6204f0e50b8fc6a7b36526a068  alpha84-source.zip' | sha256sum -c -
          mkdir work
          unzip -q alpha84-source.zip -d work
          grep -q 'mod_version=0.4.0-alpha.84' work/gradle.properties

      - name: Preflight GeckoLib armor regression guards
        working-directory: work
        shell: bash
        run: |
          set -euxo pipefail
          test "$(grep -R '@Test' -h src/test/java | wc -l)" -ge 198
          grep -q '0.4.0-alpha.84' src/main/java/com/emipokemon/Emipokemon.java
          grep -q 'extends ArmorItem implements EmiGeoArmorPiece' src/main/java/com/emipokemon/armor/EmiGeoArmorItem.java
          grep -q 'registerEmiArmorRenderer(ModRegistries.EMI_HELMET)' src/client/java/com/emipokemon/client/EmipokemonClient.java
          grep -q 'registerEmiArmorRenderer(ModRegistries.EMI_CHESTPLATE)' src/client/java/com/emipokemon/client/EmipokemonClient.java
          grep -q 'registerEmiArmorRenderer(ModRegistries.EMI_LEGGINGS)' src/client/java/com/emipokemon/client/EmipokemonClient.java
          grep -q 'registerEmiArmorRenderer(ModRegistries.EMI_BOOTS)' src/client/java/com/emipokemon/client/EmipokemonClient.java
          for bone in armorHead armorBody armorRightArm armorLeftArm armorRightLeg armorLeftLeg armorRightBoot armorLeftBoot; do
            grep -q '"name": "'"$bone"'"' src/main/resources/assets/emipokemon/geo/armor/emi_armor.geo.json
          done
          test "$(sha256sum src/main/resources/assets/emipokemon/textures/models/armor/emi_gecko_armor.png | cut -d' ' -f1)" = 'b91e3ac95b749015a50b466deb8167a2fd6c4bb4bcc248b978fdc3cd621829d6'
          test "$(sha256sum src/main/resources/assets/emipokemon/geo/armor/emi_armor.geo.json | cut -d' ' -f1)" = 'e452fb9115fb3a8d32b6962fbf58372ccac222ac64293e11a72977c0a27e70cc'
          test "$(sha256sum src/main/resources/assets/emipokemon/animations/armor/emi_armor.animation.json | cut -d' ' -f1)" = 'e7c2942c3368f19fc73a1fe2484fd48c6bcae2e8bb51a233dbda749b09fb8a96'

      - name: Test and build with Java 21
        working-directory: work
        shell: bash
        run: |
          set -euxo pipefail
          sed -i 's/\r$//' gradlew
          chmod +x gradlew
          for attempt in 1 2 3; do
            if ./gradlew --version --no-daemon; then break; fi
            if [ "$attempt" -eq 3 ]; then exit 1; fi
            sleep $((attempt * 5))
          done
          ./gradlew clean test build --no-daemon --stacktrace

      - name: Verify and package alpha.84
        shell: bash
        run: |
          set -euxo pipefail
          jar='work/build/libs/emipokemon-0.4.0-alpha.84.jar'
          test -f "$jar"
          unzip -p "$jar" fabric.mod.json | grep -q '0.4.0-alpha.84'
          for entry in \
            'com/emipokemon/armor/EmiGeoArmorItem.class' \
            'com/emipokemon/armor/EmiGeoArmorPiece.class' \
            'com/emipokemon/client/model/EmiArmorGeoModel.class' \
            'com/emipokemon/client/render/EmiArmorGeoRenderer.class' \
            'assets/emipokemon/geo/armor/emi_armor.geo.json' \
            'assets/emipokemon/textures/models/armor/emi_gecko_armor.png' \
            'assets/emipokemon/animations/armor/emi_armor.animation.json'; do
            unzip -l "$jar" | grep -q "$entry"
          done
          test "$(unzip -p "$jar" assets/emipokemon/textures/models/armor/emi_gecko_armor.png | sha256sum | cut -d' ' -f1)" = 'b91e3ac95b749015a50b466deb8167a2fd6c4bb4bcc248b978fdc3cd621829d6'
          cp alpha84-source.zip Emipokemon-0.4.0-alpha.84-source.zip
          sha256sum "$jar" Emipokemon-0.4.0-alpha.84-source.zip > SHA256SUMS-0.4.0-alpha.84.txt

      - uses: actions/upload-artifact@v4
        with:
          name: Emipokemon-0.4.0-alpha.84-github-build
          path: |
            work/build/libs/emipokemon-0.4.0-alpha.84.jar
            Emipokemon-0.4.0-alpha.84-source.zip
            SHA256SUMS-0.4.0-alpha.84.txt
            work/CHANGELOG-0.4.0-alpha.84.md
            work/GUIA-PRUEBAS-0.4.0-alpha.84.md
          if-no-files-found: error
