name: alpha73-textdisplay-chatnav-build

on:
  push:
    branches: [release/0.4.0-alpha.73]
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Download exact validated alpha.72 source artifact
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euxo pipefail
          curl -fL --retry 3 --retry-delay 2 \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H 'Accept: application/vnd.github+json' \
            'https://api.github.com/repos/andrewBristowx/Emipokemon/actions/artifacts/9167446034/zip' \
            -o alpha72-artifact.zip
          mkdir alpha72-artifact work
          unzip -q alpha72-artifact.zip -d alpha72-artifact
          source_zip="$(find alpha72-artifact -type f -name 'Emipokemon-0.4.0-alpha.72-source.zip' -print -quit)"
          test -n "$source_zip"
          echo 'de7725095a748b220faae81f86538783af04e42ddd16efd1e28ecdc608cabfa0  '"$source_zip" | sha256sum -c -
          unzip_rc=0
          unzip -q "$source_zip" -d work || unzip_rc=$?
          test "$unzip_rc" -le 1
          chmod -R u+rwX work
          grep -q 'mod_version=0.4.0-alpha.72' work/gradle.properties

      - name: Apply alpha.73 world labels and chat navigation patch
        working-directory: work
        run: |
          set -euxo pipefail
          python3 "$GITHUB_WORKSPACE/ci/alpha73_world_labels_chat_nav.py"
          grep -q 'mod_version=0.4.0-alpha.73' gradle.properties
          grep -q 'EntityType.TEXT_DISPLAY.create(world)' src/main/java/com/emipokemon/gacha/machine/GachaMachineLabelService.java
          grep -q 'nbt.putString("billboard", "center")' src/main/java/com/emipokemon/gacha/machine/GachaMachineLabelService.java
          grep -q 'nbt.putByte("see_through", (byte) 1)' src/main/java/com/emipokemon/gacha/machine/GachaMachineLabelService.java
          ! grep -q 'SeasonalPokemonWorldRenderer.drawText' src/client/java/com/emipokemon/client/render/GachaMachineRenderer.java
          grep -q 'getNavigationPath(GuiNavigation navigation)' src/client/java/com/emipokemon/client/emote/EmotesButtonWidget.java

      - name: Test and build common server and client with Java 21
        working-directory: work
        run: |
          set -euxo pipefail
          sed -i 's/\r$//' gradlew
          chmod +x gradlew
          test "$(grep -R '@Test' -h src/test/java | wc -l)" -ge 155
          for attempt in 1 2 3; do
            if ./gradlew --version --no-daemon; then break; fi
            if [ "$attempt" -eq 3 ]; then exit 1; fi
            sleep $((attempt * 5))
          done
          ./gradlew clean test build --no-daemon --stacktrace

      - name: Verify and package alpha.73 candidate
        shell: bash
        run: |
          set -euxo pipefail
          jar='work/build/libs/emipokemon-0.4.0-alpha.73.jar'
          test -f "$jar"
          unzip -p "$jar" fabric.mod.json | grep -q '0.4.0-alpha.73'
          for entry in \
            'com/emipokemon/gacha/machine/GachaMachineLabelService.class' \
            'com/emipokemon/gacha/machine/GachaMachineBlockEntity.class' \
            'com/emipokemon/client/emote/EmotesButtonWidget.class' \
            'com/emipokemon/client/render/GachaMachineRenderer.class'; do
            unzip -l "$jar" | grep -q "$entry"
          done
          test "$(unzip -p "$jar" assets/emipokemon/textures/gui/gacha/standard_gacha.png | sha256sum | cut -d' ' -f1)" = '694aadcaca9a8dcaace9c26a9e43cf41e056203855cd380670d0b7c208f4d98d'
          test "$(unzip -p "$jar" assets/emipokemon/textures/gui/gacha/emi_gacha.png | sha256sum | cut -d' ' -f1)" = '4c61d6a00e324a82d060b8c7b9a3abe40daa437fda8d8efb5a4eaf45b973e216'
          test "$(unzip -p "$jar" assets/emipokemon/textures/block/standard_gacha_machine.png | sha256sum | cut -d' ' -f1)" = '42d060134c7809f2617bcf1aa7a06f02750908eb616fcbbfb3b837dbf98e30cd'
          test "$(unzip -p "$jar" assets/emipokemon/textures/block/emi_gacha_machine.png | sha256sum | cut -d' ' -f1)" = '4d0d76caca51f7d167d3197030d7074e9ac2b7e1ade015c5a01c462ef3e4aea0'
          cd work
          zip -qr ../Emipokemon-0.4.0-alpha.73-source.zip . -x 'build/*' '.gradle/*'
          cd ..
          sha256sum "$jar" Emipokemon-0.4.0-alpha.73-source.zip > SHA256SUMS-0.4.0-alpha.73.txt

      - uses: actions/upload-artifact@v4
        with:
          name: Emipokemon-0.4.0-alpha.73-github-build
          path: |
            work/build/libs/emipokemon-0.4.0-alpha.73.jar
            Emipokemon-0.4.0-alpha.73-source.zip
            SHA256SUMS-0.4.0-alpha.73.txt
            work/CHANGELOG-0.4.0-alpha.73.md
            work/GUIA-PRUEBAS-0.4.0-alpha.73.md
          if-no-files-found: error
