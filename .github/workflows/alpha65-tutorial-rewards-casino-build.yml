name: alpha65-tutorial-rewards-casino-build

on:
  push:
    branches: [release/0.4.0-alpha.65]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - name: Download exact alpha.62 source candidate
        shell: bash
        run: |
          set -euxo pipefail
          curl -fL --retry 3 --retry-delay 2 \
            'https://drive.usercontent.google.com/download?id=1U3KGE4F-Xs1NmxJOpyXALoCD-ZICMhTm&export=download&confirm=t' \
            -o alpha62-source.zip
          echo '56cdf22219db733383da8fc20db48930105167b01571d2ac381a7c1a05e5ba6b  alpha62-source.zip' | sha256sum -c -
          python3 - <<'PY'
          from pathlib import Path, PurePosixPath
          from zipfile import ZipFile

          destination = Path("work")
          destination.mkdir()
          with ZipFile("alpha62-source.zip") as archive:
              for member in archive.infolist():
                  normalized = member.filename.replace("\\", "/")
                  relative = PurePosixPath(normalized)
                  if relative.is_absolute() or ".." in relative.parts:
                      raise SystemExit(f"Unsafe ZIP member: {member.filename!r}")
                  target = destination.joinpath(*relative.parts)
                  if member.is_dir() or normalized.endswith("/"):
                      target.mkdir(parents=True, exist_ok=True)
                      continue
                  target.parent.mkdir(parents=True, exist_ok=True)
                  with archive.open(member) as source, target.open("wb") as output:
                      output.write(source.read())
          PY
      - name: Reconstruct exact alpha.65 candidate
        working-directory: work
        run: |
          python3 "$GITHUB_WORKSPACE/ci/alpha63_core.py"
          python3 "$GITHUB_WORKSPACE/ci/alpha63_tests.py"
          python3 "$GITHUB_WORKSPACE/ci/alpha64_core.py"
          python3 "$GITHUB_WORKSPACE/ci/alpha64_tests.py"
          python3 "$GITHUB_WORKSPACE/ci/alpha65_core.py"
          python3 "$GITHUB_WORKSPACE/ci/alpha65_tests.py"
          cp "$GITHUB_WORKSPACE/CHANGELOG-0.4.0-alpha.65.md" .
          cp "$GITHUB_WORKSPACE/GUIA-PRUEBAS-0.4.0-alpha.65.md" .
      - name: Test and build common, server and client with Java 21
        working-directory: work
        run: |
          sed -i 's/\r$//' gradlew
          chmod +x gradlew
          ./gradlew clean test build --no-daemon --stacktrace
      - name: Verify candidate and package source
        shell: bash
        run: |
          set -euxo pipefail
          test -f work/build/libs/emipokemon-0.4.0-alpha.65.jar
          unzip -p work/build/libs/emipokemon-0.4.0-alpha.65.jar fabric.mod.json | grep -q '0.4.0-alpha.65'
          unzip -l work/build/libs/emipokemon-0.4.0-alpha.65.jar | grep -q 'BattlePassReward.class'
          unzip -l work/build/libs/emipokemon-0.4.0-alpha.65.jar | grep -q 'InvisibleHotspotButton.class'
          unzip -l work/build/libs/emipokemon-0.4.0-alpha.65.jar | grep -q 'PokemonPortraitRenderer.class'
          unzip -l work/build/libs/emipokemon-0.4.0-alpha.65.jar | grep -q 'michicoin_icon.png'
          unzip -l work/build/libs/emipokemon-0.4.0-alpha.65.jar | grep -q 'random_pokemon_icon.png'
          unzip -l work/build/libs/emipokemon-0.4.0-alpha.65.jar | grep -q 'casino_claw.geo.json'
          cd work
          zip -qr ../Emipokemon-0.4.0-alpha.65-source.zip . -x 'build/*' '.gradle/*'
          cd ..
          sha256sum work/build/libs/emipokemon-0.4.0-alpha.65.jar Emipokemon-0.4.0-alpha.65-source.zip > SHA256SUMS-0.4.0-alpha.65.txt
      - uses: actions/upload-artifact@v4
        with:
          name: Emipokemon-0.4.0-alpha.65-github-build
          path: |
            work/build/libs/emipokemon-0.4.0-alpha.65.jar
            Emipokemon-0.4.0-alpha.65-source.zip
            SHA256SUMS-0.4.0-alpha.65.txt
          if-no-files-found: error
